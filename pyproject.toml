[project]
name = "nonebot-plugin-fishmemory"
version = "0.1.0"
description = "给 bot 一份「关于每个人的长期记忆」：从聊天里抽名字/年龄/生日/喜好，带垃圾过滤与去重（nonebot2，零 LLM 开销）"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "173ababah" }]
keywords = ["nonebot2", "nonebot-plugin", "memory", "extract", "llm-prompt"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: Nonebot2",
  "License :: OSI Approved :: MIT License",
]
dependencies = ["nonebot2>=2.0.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/173ababah/nonebot-plugin-fishmemory"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true
